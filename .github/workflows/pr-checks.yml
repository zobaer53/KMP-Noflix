# Checks every PR into dev/main and every push to dev (see "Parallel streams" in CLAUDE.md).
# GitHub skips PR checks while a PR is in conflict: merge origin/dev into the branch (scripts/stream.sh sync).
# Needs the repository secret TMDB_API_KEY (app/build.gradle reads API_KEY from local.properties).
name: PR checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK platform, NDK and CMake
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          cmake=$(sed -n 's/^cmake = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          sdk=$(sed -n 's/^compileSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-$sdk.0" "ndk;$ndk" "cmake;$cmake" > /dev/null

      - name: Write local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          [ -n "$TMDB_API_KEY" ] || { echo "::error::Repository secret TMDB_API_KEY is not set"; exit 1; }
          printf 'sdk.dir=%s\nAPI_KEY=%s\n' "$ANDROID_HOME" "$TMDB_API_KEY" > local.properties

      - name: KMP guard (no Android/JVM imports in shared commonMain)
        run: |
          if [ -d shared/src/commonMain ] &&
             grep -rnE '^import (android|androidx\.core|java|javax)\.' shared/src/commonMain; then
            echo "::error::Android/JVM imports in shared/src/commonMain"; exit 1
          fi

      - name: Unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
