# Non-required desktop build (Phase 7a): packages installers for all three OSes and uploads them.
# The required build check stays pr-checks.yml on Linux.
name: Desktop checks

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'desktopApp/**'
      - 'shared/**'
      - 'gradle/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/desktop-checks.yml'
  push:
    branches: [dev]
    paths:
      - 'desktopApp/**'
      - 'shared/**'
      - 'gradle/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/desktop-checks.yml'
  workflow_dispatch:

concurrency:
  group: desktop-checks-${{ github.ref }}-${{ matrix.os }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: 'desktopApp/build/compose/binaries/main/dmg/*.dmg'
          - os: windows-latest
            artifact: 'desktopApp/build/compose/binaries/main/msi/*.msi'
          - os: ubuntu-latest
            artifact: 'desktopApp/build/compose/binaries/main/deb/*.deb'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Write local.properties
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdk="${sdk//\\/\\\\}"
          printf 'sdk.dir=%s\nAPI_KEY=%s\n' "$sdk" "$TMDB_API_KEY" > local.properties

      - name: Package desktop app
        shell: bash
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: noflix-desktop-${{ matrix.os }}-${{ github.sha }}
          path: ${{ matrix.artifact }}
          retention-days: 14
