# Non-required web build (Phase 8): compiles the Kotlin/Wasm app and uploads the static site.
name: Web checks

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'webApp/**'
      - 'shared/**'
      - 'gradle/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/web-checks.yml'
  push:
    branches: [dev]
    paths:
      - 'webApp/**'
      - 'shared/**'
      - 'gradle/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/web-checks.yml'
  workflow_dispatch:

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Write local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: printf 'API_KEY=%s\n' "$TMDB_API_KEY" > local.properties

      - name: Build the Kotlin/Wasm web app
        run: ./gradlew :shared:wasmJsBrowserTest :webApp:wasmJsBrowserDistribution --stacktrace

      - name: Upload static site
        uses: actions/upload-artifact@v7
        with:
          name: noflix-web-${{ github.sha }}
          path: webApp/build/dist/wasmJsBrowserDistribution/
          retention-days: 14
