# iOS checks (doc/kmp-ios-plan.md): :shared's tests on the iOS simulator, the XcodeGen drift check and a
# simulator build of iosApp. Runs only when iOS-relevant files change. NOT a required check: pr-checks.yml
# (Linux, the required `build` check) is unchanged and doesn't need this job.
# The steps that need iosApp/ or scripts/ios-secrets.sh skip themselves until those files exist.
# Needs the repository secret TMDB_API_KEY, but an empty key still builds (the app then shows TMDB's 401 as an error).
# Run it by hand on any branch: gh workflow run ios-checks.yml --ref <branch>
name: iOS checks

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - 'scripts/ios-secrets.sh'
      - '.github/workflows/ios-checks.yml'
  push:
    branches: [dev]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - 'scripts/ios-secrets.sh'
      - '.github/workflows/ios-checks.yml'
  workflow_dispatch:

concurrency:
  group: ios-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Apple silicon runner with Xcode 26 (the project targets iOS 16.0 with the iOS 26 SDK).
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      # Pick Xcode 26 explicitly in case the image's default differs.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -z "$xcode" ] || sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native toolchain and its dependencies (several hundred MB), keyed on the Kotlin version.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Gradle configures :app and the ad-block modules too, so the Android SDK pieces they need must exist,
      # as in pr-checks.yml. The macOS image ships ANDROID_HOME with the command-line tools.
      - name: Install SDK platform, NDK and CMake
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          cmake=$(sed -n 's/^cmake = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          sdk=$(sed -n 's/^compileSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            "$sdkmanager" --install "platforms;android-$sdk.0" "ndk;$ndk" "cmake;$cmake" > /dev/null && break
            [ $attempt = 3 ] && exit 1
            echo "::warning::SDK install failed (attempt $attempt), retrying"; sleep 15
          done

      - name: Write local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: printf 'sdk.dir=%s\nAPI_KEY=%s\n' "$ANDROID_HOME" "$TMDB_API_KEY" > local.properties

      # Writes the gitignored iosApp/Secrets.xcconfig (an empty key is fine: it only warns).
      - name: iOS secrets
        if: hashFiles('scripts/ios-secrets.sh') != ''
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: scripts/ios-secrets.sh

      # Every commonTest and iosTest runs on the Kotlin/Native simulator target.
      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Install XcodeGen
        if: hashFiles('iosApp/project.yml') != ''
        run: brew install xcodegen

      # iosApp.xcodeproj is committed (D5): regenerating it must change nothing.
      - name: XcodeGen drift check
        if: hashFiles('iosApp/project.yml') != ''
        run: |
          (cd iosApp && xcodegen generate)
          if [ -n "$(git status --porcelain iosApp)" ]; then
            git status --porcelain iosApp; git diff --stat iosApp
            echo "::error::iosApp.xcodeproj is out of date: run 'cd iosApp && xcodegen generate' and commit it"
            exit 1
          fi

      # The Xcode build phase runs :shared:embedAndSignAppleFrameworkForXcode. Apple silicon only (no iosX64
      # framework exists), hence ARCHS=arm64. Signing is off in project.yml.
      - name: Build iosApp for the simulator
        if: hashFiles('iosApp/project.yml') != ''
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath iosApp/build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
