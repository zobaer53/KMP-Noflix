# Search tab shows Discover; typing a query shows paged results; a result opens details.
# iOS copy of ../../flows/03_search.yaml: no hideKeyboard (the first results stay visible above the keyboard),
# and `back` becomes a tap on the on-screen back button.
appId: com.zobaer53.zedmovies
name: 03_search
---
- launchApp
- extendedWaitUntil:
    visible: "Upcoming Movies"
    timeout: 30000
- tapOn: "Search"
- extendedWaitUntil:
    visible: "Discover"
    timeout: 20000
- tapOn: "search place holder"
# A fresh simulator shows a one-time keyboard tip ("Speed up your typing ...") over the keyboard.
- tapOn:
    text: "Continue"
    optional: true
# Maestro's inputText occasionally doubles the first key ("BBatman"), so clear and retype on a miss.
- retry:
    maxRetries: 2
    commands:
      - eraseText: 20
      - inputText: "Batman"
      # TMDB's ranking changes; on iOS only the first rows fit above the keyboard. "The Batman" is the top hit.
      - extendedWaitUntil:
          visible: "The Batman"
          timeout: 20000
- takeScreenshot: search
# Tab pager: tap a tab, then swipe back to the first one.
- tapOn: "Tv Shows"
- extendedWaitUntil:
    visible: "Rating"
    timeout: 20000
# With the keyboard up, the bottom bar sits at ~55-60% of the screen: swipe inside the result list.
- swipe:
    start: "20%, 35%"
    end: "85%, 35%"
- extendedWaitUntil:
    visible: "The Batman"
    timeout: 20000
# First result's poster (the search field also contains "Batman").
- tapOn:
    text: "Rating"
    below: "Tv Shows"
    index: 0
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Overview"
    timeout: 20000
- tapOn: "back"
