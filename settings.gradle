pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    // :shared's jvmToolchain(17) needs a JDK 17. With only a newer JDK installed (CLAUDE.md allows
    // "17+"), Gradle downloads one instead of failing to configure.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    // Kotlin/Wasm adds a Node.js distribution repository at project level for its browser toolchain.
    // PREFER_PROJECT lets that toolchain download work; all regular dependencies still come from
    // google()/mavenCentral() declared here (no module declares its own Maven repository).
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "zeDMovies"
include ':app'
include ':baselineprofile'
include ':desktopApp'
include ':webApp'
include ':shared'
include ':adblock-client'
include ':ad-filter'
