
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.roborazzi)
    alias(libs.plugins.androidx.baselineprofile)
}


android {
    namespace 'com.zobaer53.zedmovies'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.zobaer53.zedmovies"
        minSdk 26
        targetSdk 37
        // CI passes -PappVersionCode/-PappVersionName (see .github/workflows/release.yml).
        // To start a new minor/major line, raise versionName here; CI releases it next.
        versionCode project.hasProperty("appVersionCode") ? project.property("appVersionCode").toInteger() : 3
        versionName project.findProperty("appVersionName") ?: "3.1.0"

        vectorDrawables {
            useSupportLibrary true
        }
        Properties properties = new Properties()
        properties.load(project.rootProject.file("local.properties").newDataInputStream())
        buildConfigField "String","API_KEY","\"${properties.getProperty("API_KEY")}\""
    }

    signingConfigs {
        release {
            Properties signing = new Properties()
            signing.load(project.rootProject.file("local.properties").newDataInputStream())
            if (signing.getProperty("RELEASE_STORE_FILE") != null) {
                storeFile file(signing.getProperty("RELEASE_STORE_FILE"))
                storePassword signing.getProperty("RELEASE_STORE_PASSWORD")
                keyAlias signing.getProperty("RELEASE_KEY_ALIAS")
                keyPassword signing.getProperty("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests {
            // Robolectric screenshot tests render with the app's resources.
            includeAndroidResources = true
        }
    }
}


dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.activity.compose
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.webkit
    // Applies the bundled Baseline Profile on installs that don't come from Play (GitHub APKs).
    implementation libs.androidx.profileinstaller
    baselineProfile project(':baselineprofile')

    // Compose comes from :shared (api). The BOM only versions the debug tooling (the same 1.12.1 as release).
    debugImplementation platform(libs.androidx.compose.bom)
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    // Version pin only, not used by :app's code: it makes every androidx.navigation:* on Android 2.10.2
    // (:shared's JetBrains navigation-compose 2.10.0-rc01 maps to androidx 2.10.0).
    implementation libs.androidx.navigation.compose
    implementation platform(libs.koin.bom)
    implementation libs.koin.core
    implementation libs.koin.android

    implementation libs.youtube.player.core

    // Domain, data, the UI and their DI modules (Kotlin Multiplatform)
    implementation project(':shared')

    // Ad blocker
    implementation project(':ad-filter')

    testImplementation libs.junit
    testImplementation libs.koin.test
    testImplementation platform(libs.androidx.compose.bom)
    testImplementation libs.androidx.compose.ui.test.junit4
    testImplementation libs.robolectric
    testImplementation libs.roborazzi
    testImplementation libs.roborazzi.compose
    testImplementation libs.roborazzi.junit.rule
}
